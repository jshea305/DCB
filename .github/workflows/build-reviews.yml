name: Pre-render Reviews & Songs HTML

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/testimonials.json'
      - 'data/songs.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run static HTML generators
        run: |
          node js/generate-reviews.js
          node js/generate-songs.js

      - name: Commit updated HTML
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: pre-render reviews and songs HTML"
          file_pattern: 'testimonials.html songs.html'
