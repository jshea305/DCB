<section class="songs-section" style="max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <h1>Song List &amp; Repertoire</h1>
    <p>From high-energy Motown, funk, and disco to smooth cocktail jazz and custom first-dance requests.</p>
  </div>

  <!-- Search & Category Filter Controls -->
  <div class="song-controls" style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 2rem;">
    <input
      type="text"
      id="song-search"
      placeholder="Search by song title or artist..."
      aria-label="Search songs"
      style="padding: 0.65rem 1rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; min-width: 260px;"
    />
    <button type="button" class="filter-btn active" data-filter="all">All Songs</button>
    <button type="button" class="filter-btn" data-filter="Dance, Funk &amp; R&amp;B">Dance, Funk &amp; R&amp;B</button>
    <button type="button" class="filter-btn" data-filter="Dinner, Cocktail &amp; Slow">Dinner, Cocktail &amp; Slow</button>
  </div>

  <p id="song-count" style="text-align: center; opacity: 0.8; margin-bottom: 1.5rem; font-size: 0.95rem;"></p>

  <!-- Pre-rendered Static Song Grid -->
  <div id="songs-container" class="songs-grid">
  </div> <!-- /songs-container -->
</section>

<style>
  .songs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 0.85rem;
  }
  .song-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .song-info {
    display: flex;
    flex-direction: column;
  }
  .song-title {
    font-weight: 600;
    color: #fff;
  }
  .song-artist {
    font-size: 0.85rem;
    opacity: 0.75;
  }
  .song-badge {
    font-size: 0.72rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: rgba(245, 197, 24, 0.15);
    color: #f5c518;
    white-space: nowrap;
  }
  .filter-btn {
    padding: 0.6rem 1rem;
    border-radius: 6px;
    border: 1px solid rgba(245, 197, 24, 0.4);
    background: transparent;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .filter-btn.active,
  .filter-btn:hover {
    background: #f5c518;
    color: #1a0d26;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('song-search');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const songItems = Array.from(document.querySelectorAll('.song-item'));
    const countLabel = document.getElementById('song-count');
    let activeCategory = 'all';

    function filterSongs() {
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;

      songItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        const category = item.getAttribute('data-category');
        const matchesCategory = activeCategory === 'all' || category === activeCategory;
        const matchesQuery = !query || text.includes(query);

        if (matchesCategory && matchesQuery) {
          item.style.display = 'flex';
          visible++;
        } else {
          item.style.display = 'none';
        }
      });

      countLabel.textContent = `Showing ${visible} of ${songItems.length} songs`;
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-filter');
        filterSongs();
      });
    });

    searchInput.addEventListener('input', filterSongs);
    filterSongs();
  });
</script>
