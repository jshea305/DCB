<!-- VIP Fan List Container (Centered & Styled) -->
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="width: 100%; max-width: 520px; padding: 40px 30px; background: #ffffff; border: 2px solid #b89762; border-radius: 16px; text-align: center; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);">
    
    <!-- Music Badge Icon -->
    <div style="width: 64px; height: 64px; margin: 0 auto 20px; background: linear-gradient(135deg, #b89762, #d4af37); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 4px 12px rgba(184, 151, 98, 0.4);">
      <i class="fas fa-music"></i>
    </div>

    <!-- Main Heading -->
    <h2 style="font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; letter-spacing: 0.5px;">
      Join Our VIP Fan List
    </h2>
    
    <!-- Subheading -->
    <p style="font-size: 1.05rem; line-height: 1.5; color: #555555; margin-bottom: 28px;">
      Get upcoming show dates, text alerts, and exclusive gig announcements sent straight to you!
    </p>

    <!-- Form -->
    <form action="https://formsubmit.co/davidwilson@downcityband.com" method="POST" style="display: flex; flex-direction: column; gap: 16px; align-items: center;">
      <input type="hidden" name="_subject" value="New Fan Sign-up (Email & Phone)!">
      <input type="text" name="_honey" style="display:none">
      
      <!-- Email Field -->
      <input type="email" name="email" placeholder="Email Address *" required style="width: 100%; padding: 16px 20px; border: 1.5px solid #dddddd; border-radius: 10px; font-size: 1.05rem; text-align: center; outline: none; background: #fafafa; transition: border-color 0.2s;">

      <!-- Phone Field -->
      <input type="tel" name="phone" placeholder="Phone Number (Optional)" style="width: 100%; padding: 16px 20px; border: 1.5px solid #dddddd; border-radius: 10px; font-size: 1.05rem; text-align: center; outline: none; background: #fafafa; transition: border-color 0.2s;">

      <!-- Submit Button -->
      <button type="submit" style="width: 100%; background: linear-gradient(135deg, #b89762, #9a7b48); color: #ffffff; font-weight: 700; padding: 16px; border: none; border-radius: 10px; font-size: 1.15rem; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 6px 16px rgba(184, 151, 98, 0.35); margin-top: 8px; transition: transform 0.2s;">
        <i class="fas fa-paper-plane" style="margin-right: 10px;"></i> Join The VIP List
      </button>
    </form>
    
  </div>
</div>
