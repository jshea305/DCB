<!-- Full-Width Mobile VIP Fan List Container -->
<div style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 12px; width: 100%; box-sizing: border-box;">
  <div style="width: 100%; padding: 48px 16px; background: #ffffff; border: 2px solid #b89762; border-radius: 16px; text-align: center; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15); box-sizing: border-box;">
    
    <!-- Music Badge Icon -->
    <div style="width: 72px; height: 72px; margin: 0 auto 24px; background: linear-gradient(135deg, #b89762, #d4af37); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 6px 16px rgba(184, 151, 98, 0.4);">
      <i class="fas fa-music"></i>
    </div>

    <!-- Main Heading -->
    <h2 style="font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 700; margin-bottom: 12px; color: #1a1a1a; letter-spacing: 0.5px;">
      Join Our VIP Fan List
    </h2>
    
    <!-- Subheading -->
    <p style="font-size: 1.15rem; line-height: 1.5; color: #555555; margin-bottom: 32px; padding: 0 8px;">
      Get upcoming show dates, text alerts, and exclusive gig announcements sent straight to you!
    </p>

    <!-- Form -->
    <form action="https://formsubmit.co/davidwilson@downcityband.com" method="POST" style="display: flex; flex-direction: column; gap: 18px; width: 100%; box-sizing: border-box;">
      <input type="hidden" name="_subject" value="New Fan Sign-up (Email & Phone)!">
      <input type="text" name="_honey" style="display:none">
      
      <!-- Email Field (Full Width) -->
      <input type="email" name="email" placeholder="Email Address *" required style="width: 100%; padding: 18px 16px; border: 2px solid #cccccc; border-radius: 10px; font-size: 1.15rem; text-align: center; outline: none; background: #fafafa; box-sizing: border-box;">

      <!-- Phone Field (Full Width) -->
      <input type="tel" name="phone" placeholder="Phone Number (Optional)" style="width: 100%; padding: 18px 16px; border: 2px solid #cccccc; border-radius: 10px; font-size: 1.15rem; text-align: center; outline: none; background: #fafafa; box-sizing: border-box;">

      <!-- Submit Button (Full Width) -->
      <button type="submit" style="width: 100%; background: linear-gradient(135deg, #b89762, #9a7b48); color: #ffffff; font-weight: 700; padding: 18px; border: none; border-radius: 10px; font-size: 1.25rem; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 6px 18px rgba(184, 151, 98, 0.4); margin-top: 6px; box-sizing: border-box;">
        <i class="fas fa-paper-plane" style="margin-right: 10px;"></i> Join The VIP List
      </button>
    </form>
    
  </div>
</div>
