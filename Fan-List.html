<!-- Simple FormSubmit Email Signup -->
<form action="https://formsubmit.co/your-email@example.com" method="POST" style="margin: 20px 0;">
    <input type="hidden" name="_subject" value="New Fan Email Signup!">
    <input type="email" name="email" placeholder="Enter your email" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
    <button type="submit" style="padding: 10px 16px; background-color: var(--accent-gold, #b89762); color: #fff; border: none; border-radius: 4px; cursor: pointer;">
        Join Fan List
    </button>
</form>
